<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PANIC! 2.2 — Brainrot Edition (Original Animation Preserved)</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080e1c;color:white;font-family:system-ui,sans-serif;display:flex;justify-content:center}#game{width:min(100vw,520px);background:#080e1c;border-radius:18px;overflow:hidden;touch-action:none;user-select:none}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#101a2c}.mission{padding:8px 16px 10px;background:#101a2c;border-top:1px solid #1b2a43}.missionline{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:850;color:#b9c9dc}.missionline span:last-child{color:#ff6285}.missionbar{height:5px;border-radius:9px;background:#29374d;margin-top:8px;overflow:hidden}.missionfill{height:100%;width:0;background:#ff4d70;transition:width .12s}.logo{font-weight:1000;font-size:22px;letter-spacing:1px}.sub{font-size:10px;color:#9db4ce}.score{text-align:right;font-size:25px;font-weight:1000}#stage{position:relative}canvas{display:block;width:100%;aspect-ratio:3/4;background:#101a2e;touch-action:none}.overlay{position:absolute;inset:0;background:#07101ddd;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}.overlay h1{font-size:32px;margin:6px}.overlay p{line-height:1.5;color:#c3d8ef;font-size:14px}.overlay button{border:0;border-radius:12px;background:#16dfff;color:#07101b;font-size:18px;font-weight:950;padding:14px 34px}.hidden{display:none!important}.controls{display:flex;gap:10px;padding:12px;background:#101a2c}.controls button{flex:1;padding:13px;border:1px solid #30445d;border-radius:12px;background:#18263b;color:white;font-size:22px;font-weight:900}.utility{display:flex;gap:8px;padding:0 12px 12px;background:#101a2c}.utility button{flex:1;padding:9px;border:1px solid #30445d;border-radius:10px;background:#18263b;color:#dcecff;font-size:12px;font-weight:850}.utility .accent{color:#19e3ff}.hint{flex:2;text-align:center;font-size:11px;color:#9db4ce;align-self:center;line-height:1.5}.hint b{color:white}
</style>
<div id="game"><div class="top"><div><div class="logo">PANIC! <span style="color:#ff4f78">2.2</span></div><div class="sub" style="color:#e6a7b8">HARD FROM SECOND ZERO · BRAINROT</div></div><div class="score"><span id="score">000</span><div class="sub">BEST <span id="best">0</span></div></div></div><div class="mission"><div class="missionline"><span id="missionText">Survive 15 seconds</span><span id="rage">RAGE 1</span></div><div class="missionbar"><div class="missionfill" id="missionFill"></div></div></div>
<div id="stage"><canvas id="c"></canvas><div id="start" class="overlay"><div style="font-size:46px">🧑‍💼💨</div><h1>PANIC! 2.2</h1><p>Hard from second zero.<br>No excuses. Dodge.<br>Survive as long as you can. 💀</p><button id="play">RAGE START ▶</button><p>Drag left/right to steer</p></div><div id="over" class="overlay hidden"><div style="font-size:44px">💥</div><h1>OH NO!</h1><p id="result"></p><button id="retry">PLAY AGAIN ↻</button></div><div id="toast" style="position:absolute;top:22%;left:0;width:100%;text-align:center;font-weight:1000;font-size:27px;color:#fff;text-shadow:0 2px 12px #00eaff;pointer-events:none;opacity:0;transform:scale(.8)">CLOSE CALL!</div></div>
<div class="controls"><button id="left" aria-label="Move left">◀</button><div class="hint">HARD MODE<br><b style="color:#ffb16c">POTATO HEAD 💀</b></div><button id="right" aria-label="Move right">▶</button></div><div class="utility"><button id="pause" class="accent">Ⅱ PAUSE</button><button id="restart">↻ RESTART</button><button id="sound">♪ SOUND: OFF</button></div></div>
<script>
(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),start=document.getElementById('start'),over=document.getElementById('over'),result=document.getElementById('result'),toast=document.getElementById('toast');
let W=360,H=480,run=false,dead=false,paused=false,t=0,last=0,score=0,best=0,x=180,vx=0,pointer=null,keys=0,spawn=0,obs=[],particles=[],powerups=[],shield=0,combo=0,mult=1,near=[],shake=0,slow=1,toastTimer=0,raf=0,missionDone=false,brainrotTimer=4,soundOn=false,audioCtx=null;
const brainrot=['BRO HAS NEGATIVE AURA 💀','SKILL ISSUE + L RATIO','YOU GOT FANUM TAXED 🍕','OHIO FINAL BOSS SPAWNED','RIZZ NOT FOUND 🚫','BRO IS COOKED 🔥','MANGO MANGO MANGO 🥭','WHAT THE SIGMA?!','ABSOLUTE CINEMA 🎬','BRO IS NOT HIM','CHAT, IS THIS REAL?','GYATT DETECTED 🚨','CERTIFIED YAPPER 🗣️','AURA POINTS: -9999','BRO FAILED THE VIBE CHECK','SKIBIDI DOP DOP YES YES 🚽','LET HIM COOK 👨‍🍳','BRO IS NOT BEATING THE ALLEGATIONS','ERM… WHAT THE SIGMA? 🤓','MOGGED BY A TOILET','BRO GOT COOKED IN 4K','WE GOT BRAINROT BEFORE GTA 6','LOCK INNN 🗿','BRO IS TWEAKING 😭','THAT IS CRAZY WORK'];
const brainrotEmojis=['🗿','🚽','🥭','💀','🐊','🍌','🧠','🦈','🤡','🦆','🍉','🧌','🥶','🪿','🧃','👹','🧀','🦖'];
const bestEl=document.getElementById('best'),missionText=document.getElementById('missionText'),missionFill=document.getElementById('missionFill'),rageEl=document.getElementById('rage');try{best=+(localStorage.getItem('panic22best')||0)}catch(e){}bestEl.textContent=best;
function updateMission(){const target=15;missionText.textContent=missionDone?'Mission complete. Now don’t die.':'Survive 15 seconds';missionFill.style.width=Math.min(100,t/target*100)+'%';rageEl.textContent='RAGE '+(1+Math.floor(t/12));}
function resize(){c.width=720;c.height=960;ctx.setTransform(2,0,0,2,0,0)}resize();
function poly(a,col,stroke){ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=col;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function box(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}
function person(px,py){ctx.save();ctx.translate(px,py);ctx.rotate(Math.sin(t*7)*.09+vx*.018);ctx.strokeStyle='#dfaa7c';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-9,-3);ctx.lineTo(-22+Math.sin(t*12)*10,-17+Math.cos(t*9)*7);ctx.moveTo(9,-3);ctx.lineTo(22+Math.cos(t*11)*10,-16+Math.sin(t*9)*7);ctx.stroke();ctx.strokeStyle='#18263d';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-6,18);ctx.lineTo(-13+Math.sin(t*12)*8,36);ctx.moveTo(6,18);ctx.lineTo(13+Math.cos(t*12)*8,36);ctx.stroke();poly([[-13,-9],[13,-9],[11,19],[-11,19]],'#172943','#4a6c92');poly([[-5,-8],[5,-8],[2,8],[-2,8]],'#e9f4ff');poly([[0,-5],[4,-5],[2,9],[0,12],[-2,9]],'#ff4b50');ctx.fillStyle='#c88960';ctx.beginPath();ctx.ellipse(0,-20,12,14,0,0,7);ctx.fill();ctx.fillStyle='#25202a';ctx.beginPath();ctx.ellipse(0,-27,12,7,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(-4,-21,2.4,0,7);ctx.arc(4,-21,2.4,0,7);ctx.fill();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#111c34');sky.addColorStop(1,'#243d59');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
let speed=235+Math.min(t*5,200);for(let i=0;i<9;i++){let yy=((i*75+t*speed)%600)-100;poly([[-5,yy],[75,yy-12],[75,yy+36],[-5,yy+48]],'#243953')}
for(let i=0;i<8;i++){let yy=((i*85+t*speed)%650)-100,spread=78+(yy+100)/580*75,left=180-spread,right=180+spread;box(0,yy,left,75,'#24354c');box(right,yy,360-right,75,'#202f46');for(let j=0;j<4;j++){box(left-10-j*24,yy+10,12,18,(i+j)%3?'#3a7e9b':'#f4b35f');let rx=right+10+j*24;if(rx<356)box(rx,yy+10,12,18,(i+j)%2?'#3a7e9b':'#f4b35f')}box(left-3,yy,4,75,'#19dfff');box(right-1,yy,4,75,'#19dfff')}
ctx.restore();
powerups.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor='#9dffb4';ctx.shadowBlur=20;ctx.textAlign='center';ctx.font='28px system-ui';ctx.fillText(p.emoji,0,0);ctx.restore()});if(shield>0){ctx.save();ctx.strokeStyle='#9dffb4';ctx.lineWidth=3;ctx.shadowColor='#9dffb4';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(x,H*.72-7,27,0,Math.PI*2);ctx.stroke();ctx.restore()}obs.forEach(o=>{ctx.save();ctx.translate(o.x,o.y+12);ctx.shadowColor=o.col||'#19dfff';ctx.shadowBlur=18;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=(30+o.depth*10)+'px system-ui';ctx.fillText(o.emoji||'💀',0,0);ctx.restore()});
particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);box(p.x,p.y,3,3,p.col);ctx.globalAlpha=1});person(x,H*.72);
if(t>8&&!dead){ctx.fillStyle='#ffb16c';ctx.font='900 14px system-ui';ctx.fillText('PANIC MODE',12,24);box(12,31,Math.min(140,(t-8)*7),4,'#ff684f')}
ctx.restore()}
function startGame(){run=true;dead=false;paused=false;t=0;score=0;x=180;vx=0;pointer=null;keys=0;spawn=.22;obs=[];particles=[];powerups=[];shield=0;combo=0;mult=1;slow=1;shake=0;toastTimer=0;missionDone=false;brainrotTimer=3;toast.style.opacity=0;start.classList.add('hidden');over.classList.add('hidden');document.getElementById('pause').textContent='Ⅱ PAUSE';updateMission();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function closeCall(o){if(o.near)return;o.near=true;combo++;mult=Math.min(5,1+Math.floor(combo/2));score+=25*mult;slow=.58;shake=8;toast.innerHTML=['CLOSE CALL!','AURA +'+(25*mult)+' 🗿','BRO ALMOST GOT COOKED 💀','LOCK INNN 🗣️','MOGGING THE OBSTACLES'][Math.random()*5|0]+' <span style="color:#19e3ff">+'+(25*mult)+' x'+mult+'</span>';toast.style.opacity=1;toast.style.transform='scale(1.12)';toastTimer=.8;for(let i=0;i<14;i++)particles.push({x:x+(Math.random()-.5)*25,y:H*.72+(Math.random()-.5)*25,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,life:.5,col:i%2?'#19dfff':'#ffd36a'})}
function finish(){dead=true;run=false;paused=false;keys=0;pointer=null;best=Math.max(best,score);bestEl.textContent=best;try{localStorage.setItem('panic22best',best)}catch(e){}result.textContent='Score '+score+' · '+Math.floor(t*10)+' meters'+(mult>1?' · Combo x'+mult:'')+'.';over.classList.remove('hidden')}
function loop(now){if(!run)return;let dt=Math.min((now-last)/1000,.035);last=now;if(paused){draw();raf=requestAnimationFrame(loop);return}if(!dead){let eff=dt*slow;slow=Math.min(1,slow+dt*1.8);t+=eff;score+=Math.floor(eff*10);scoreEl.textContent=String(score).padStart(3,'0');if(t>=15&&!missionDone){missionDone=true;score+=100;scoreEl.textContent=String(score).padStart(3,'0')}updateMission();let steer=keys;if(pointer!==null)steer=Math.max(-1,Math.min(1,(pointer-180)/100));vx+=(steer*780-vx*3.2)*dt;x+=vx*dt;x=Math.max(18,Math.min(342,x));spawn-=eff;if(spawn<=0){const first=42+Math.random()*276;obs.push({x:first,y:-35,depth:Math.random(),near:false,emoji:brainrotEmojis[Math.random()*brainrotEmojis.length|0],col:Math.random()<.5?'#19dfff':'#ff4f78'});if(Math.random()<.82){let side=Math.random()<.5?-1:1;let second=Math.max(38,Math.min(322,first+side*(58+Math.random()*52)));obs.push({x:second,y:-105,depth:Math.random(),near:false,emoji:brainrotEmojis[Math.random()*brainrotEmojis.length|0],col:'#ffd36a'})}if(t>8&&Math.random()<.48){let third=Math.max(35,Math.min(325,first+(Math.random()<.5?-1:1)*(95+Math.random()*80)));obs.push({x:third,y:-175,depth:Math.random(),near:false,emoji:brainrotEmojis[Math.random()*brainrotEmojis.length|0],col:'#ff4f78'})}spawn=Math.max(.28,.52-t*.0035)}if(Math.random()<dt*.055&&powerups.length<1){powerups.push({x:35+Math.random()*290,y:-25,emoji:'🛡️',near:false})}powerups.forEach(p=>p.y+=eff*280);powerups=powerups.filter(p=>p.y<H+30);let py=H*.72;for(let p of powerups){if(Math.abs(p.y-py)<25&&Math.abs(p.x-x)<28){shield=6;score+=75;p.y=H+100;toast.innerHTML='SHIELD ACTIVATED 🛡️ <span style="color:#19e3ff">+75</span>';toast.style.opacity=1;toastTimer=1;for(let i=0;i<18;i++)particles.push({x:x+(Math.random()-.5)*36,y:py+(Math.random()-.5)*36,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,life:.65,col:i%2?'#19dfff':'#9dffb4'})}}shield=Math.max(0,shield-dt);py=H*.72;for(let o of obs){o.y+=eff*(360+Math.min(t*9,330));let dy=Math.abs(o.y-py);if(!o.near&&dy<43&&Math.abs(o.x-x)<44&&Math.abs(o.x-x)>24)closeCall(o);if(dy<24&&Math.abs(o.x-x)<24){if(shield>0){o.y=H+100;shield=0;shake=12;toast.textContent='SHIELD SAVED YOU 💀';toast.style.opacity=1;toastTimer=1;score+=50}else{finish();break}}}obs=obs.filter(o=>o.y<H+50);if(t>8&&Math.random()<dt*.15){slow=.9}brainrotTimer-=dt;if(brainrotTimer<=0&&toastTimer<=0){toast.textContent=brainrot[Math.random()*brainrot.length|0];toast.style.opacity=1;toast.style.transform='scale(1.04)';toastTimer=1.05;brainrotTimer=3.5+Math.random()*3.5}}if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0){toast.style.opacity=0;toast.style.transform='scale(.8)'}}shake=Math.max(0,shake-dt*28);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);draw();raf=requestAnimationFrame(loop)}
document.getElementById('play').addEventListener('click',startGame);document.getElementById('retry').addEventListener('click',startGame);document.getElementById('restart').addEventListener('click',startGame);document.getElementById('pause').addEventListener('click',()=>{if(!run)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';if(paused){toast.textContent='PAUSED';toast.style.opacity=1}else{toast.style.opacity=0;last=performance.now()}});document.getElementById('sound').addEventListener('click',()=>{soundOn=!soundOn;document.getElementById('sound').textContent='♪ SOUND: '+(soundOn?'ON':'OFF');if(soundOn){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){soundOn=false;document.getElementById('sound').textContent='♪ SOUND: OFF'}}});
// Keep the original animation; only make controls reliable on mobile browsers.
const stage=document.getElementById('stage');
function canvasX(e){const r=c.getBoundingClientRect();return (e.clientX-r.left)/r.width*360}
c.addEventListener('pointerdown',e=>{e.preventDefault();if(!run||dead){startGame()}pointer=canvasX(e);try{c.setPointerCapture(e.pointerId)}catch(_){}});
c.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||e.buttons)pointer=canvasX(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>c.addEventListener(ev,()=>pointer=null));
function bind(id,val){const b=document.getElementById(id);const down=e=>{e.preventDefault();keys=val;if(!run||dead)startGame()};const up=e=>{if(e)e.preventDefault();if(keys===val)keys=0};b.style.touchAction='none';b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);b.addEventListener('click',e=>{e.preventDefault();if(!run||dead)startGame();keys=val;setTimeout(()=>{if(keys===val)keys=0},140)});}
bind('left',-1);bind('right',1);window.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){keys=-1;e.preventDefault()}if(['ArrowRight','d','D'].includes(e.key)){keys=1;e.preventDefault()}if(e.key===' '){e.preventDefault();if(!run||dead)startGame();else{paused=!paused;document.getElementById('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';last=performance.now()}}if(e.key==='Escape'&&run){paused=!paused;document.getElementById('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';last=performance.now()}});window.addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key)&&keys===-1)keys=0;if(['ArrowRight','d','D'].includes(e.key)&&keys===1)keys=0});draw();
})();
</script></html>
