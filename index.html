function startGame(isDaily=false){window.panicIsDaily=!!isDaily;run=true;dead=false;paused=false;t=0;score=0;x=180;vx=0;pointer=null;keys=0;spawn=.22;obs=[];particles=[];powerups=[];coinItems=[];coinsThisRun=0;shield=0;combo=0;mult=1;slow=1;shake=0;toastTimer=0;missionDone=false;brainrotTimer=3;toast.style.opacity=0;start.classList.add('hidden');over.classList.add('hidden');document.getElementById('panel').classList.add('hidden');try{localStorage.setItem('panicPlayed','1')}catch(e){}document.getElementById('pause').textContent='Ⅱ PAUSE';updateMission();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function closeCall(o){if(o.near)return;o.near=true;combo++;flashTimer=.22;stage.classList.add('flash');setTimeout(()=>stage.classList.remove('flash'),420);mult=Math.min(5,1+Math.floor(combo/2));score+=25*mult;slow=.52;shake=10;toast.innerHTML=['⚡ CLOSE CALL! ⚡','AURA +'+(25*mult)+' 🗿','BRO ALMOST GOT COOKED 💀','NEON DODGE!!! ✨','LOCK INNN 🗣️'][Math.random()*5|0]+' <span style="color:#fff;text-shadow:0 0 8px #00f7ff,0 0 18px #ff00ea">+'+(25*mult)+' x'+mult+'</span>';toast.style.opacity=1;toast.style.transform='scale(1.22)';toastTimer=.95;for(let i=0;i<28;i++)particles.push({x:x+(Math.random()-.5)*44,y:H*.72+(Math.random()-.5)*40,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,life:.65,col:['#19dfff','#ff00ea','#ffd36a','#9dffb4'][i%4]})}
function finish(){dead=true;run=false;paused=false;keys=0;pointer=null;best=Math.max(best,score);bestEl.textContent=best;try{if(window.panicIsDaily&&t>=25){const seed=daySeed();if(localStorage.getItem('panicDailyDone')!==String(seed)){coins+=50;localStorage.setItem('panicDailyDone',String(seed));toast.textContent='DAILY CLEARED! +50 COINS 🎉';}}localStorage.setItem('panic22best',best);let scores=JSON.parse(localStorage.getItem('panicScores')||'[]');scores.push({score,time:Math.floor(t)});scores.sort((a,b)=>b.score-a.score);localStorage.setItem('panicScores',JSON.stringify(scores.slice(0,5)));if(t>=15&&!achievements.includes('survivor'))achievements.push('survivor');if(coins>=25&&!achievements.includes('coinhunter'))achievements.push('coinhunter');saveProgress()}catch(e){}result.textContent='Score '+score+' · '+Math.floor(t*10)+' meters · 🪙 '+coinsThisRun+' coins'+(mult>1?' · Combo x'+mult:'')+'.'+(window.panicIsDaily&&t>=25?' DAILY CHALLENGE COMPLETE! +50 COINS 🎉':'');over.classList.remove('hidden')}
function loop(now){if(!run)return;let dt=Math.min((now-last)/1000,.035);last=now;if(paused){draw();raf=requestAnimationFrame(loop);return}if(!dead){let eff=dt*slow;slow=Math.min(1,slow+dt*1.8);t+=eff;score+=Math.floor(eff*10);scoreEl.textContent=String(score).padStart(3,'0');if(t>=15&&!missionDone){missionDone=true;score+=100;scoreEl.textContent=String(score).padStart(3,'0');toast.textContent='MISSION CLEAR! +100 ✨';toast.style.opacity=1;toast.style.transform='scale(1.18)';toastTimer=1.1;flashTimer=.3;stage.classList.add('flash');setTimeout(()=>stage.classList.remove('flash'),650)}updateMission();let steer=keys;if(pointer!==null)steer=Math.max(-1,Math.min(1,(pointer-180)/92));vx+=(steer*835-vx*3.2)*dt;x+=vx*dt;x=Math.max(18,Math.min(342,x));spawn-=eff;if(spawn<=0){const first=42+Math.random()*276;obs.push({x:first,y:-35,depth:Math.random(),near:false,emoji:brainrotEmojis[Math.random()*brainrotEmojis.length|0],col:Math.random()<.5?'#19dfff':'#ff4f78'});/* Fairer mode: one obstacle per wave, falling from the top */spawn=Math.max(.48,.78-t*.002)}if(Math.random()<dt*.42&&coinItems.length<4){coinItems.push({x:28+Math.random()*304,y:-20})}coinItems.forEach(p=>p.y+=eff*235);for(const p of coinItems){if(Math.abs(p.y-H*.72)<24&&Math.abs(p.x-x)<28){p.y=H+100;coins++;coinsThisRun++;score+=15;saveProgress();toast.textContent='COIN +1 🪙';toast.style.opacity=1;toastTimer=.65}}coinItems=coinItems.filter(p=>p.y<H+25);if(Math.random()<dt*.055&&powerups.length<1){powerups.push({x:35+Math.random()*290,y:-25,emoji:'🛡️',near:false})}powerups.forEach(p=>p.y+=eff*280);powerups=powerups.filter(p=>p.y<H+30);let py=H*.72;for(let p of powerups){if(Math.abs(p.y-py)<25&&Math.abs(p.x-x)<28){shield=6;score+=75;p.y=H+100;toast.innerHTML='SHIELD ACTIVATED 🛡️ <span style="color:#19e3ff">+75</span>';toast.style.opacity=1;toastTimer=1;for(let i=0;i<18;i++)particles.push({x:x+(Math.random()-.5)*36,y:py+(Math.random()-.5)*36,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,life:.65,col:i%2?'#19dfff':'#9dffb4'})}}shield=Math.max(0,shield-dt);py=H*.72;for(let o of obs){o.y+=eff*(320+Math.min(t*7,250));let dy=Math.abs(o.y-py);if(!o.near&&dy<43&&Math.abs(o.x-x)<44&&Math.abs(o.x-x)>24)closeCall(o);if(dy<24&&Math.abs(o.x-x)<24){if(shield>0){o.y=H+100;shield=0;shake=12;toast.textContent='SHIELD SAVED YOU 💀';toast.style.opacity=1;toastTimer=1;score+=50}else{finish();break}}}obs=obs.filter(o=>o.y<H+50);if(t>8&&Math.random()<dt*.15){slow=.9}brainrotTimer-=dt;if(brainrotTimer<=0&&toastTimer<=0){toast.textContent=brainrot[Math.random()*brainrot.length|0];toast.style.opacity=1;toast.style.transform='scale(1.04)';toastTimer=1.05;brainrotTimer=3.5+Math.random()*3.5}}if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0){toast.style.opacity=0;toast.style.transform='scale(.8)'}}shake=Math.max(0,shake-dt*28);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);draw();if(flashTimer>0){flashTimer=Math.max(0,flashTimer-dt);ctx.save();ctx.globalAlpha=Math.min(1,flashTimer*5);ctx.strokeStyle='#00f7ff';ctx.shadowColor='#ff00ea';ctx.shadowBlur=28;ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,H*.72,34+(0.22-flashTimer)*130,0,Math.PI*2);ctx.stroke();ctx.restore()}raf=requestAnimationFrame(loop)}
document.getElementById('play').addEventListener('click',startGame);document.getElementById('retry').addEventListener('click',startGame);document.getElementById('restart').addEventListener('click',startGame);document.getElementById('pause').addEventListener('click',()=>{if(!run)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';if(paused){toast.textContent='PAUSED';toast.style.opacity=1}else{toast.style.opacity=0;last=performance.now()}});let musicTimer=null,musicStep=0,musicMaster=null;
function musicNote(freq,duration,volume,wave='square',when=0){
  if(!audioCtx||!musicMaster)return;
  const now=audioCtx.currentTime+(when||0),osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type=wave;osc.frequency.setValueAtTime(freq,now);
  gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+0.012);gain.gain.exponentialRampToValueAtTime(0.0001,now+duration);
  osc.connect(gain);gain.connect(musicMaster);osc.start(now);osc.stop(now+duration+0.03);
}
function playMusicStep(){
  if(!soundOn||!audioCtx)return;
  // Original dark, retro 8-bit motif in a minor key; not a recording or copy of a game soundtrack.
  const melody=[0,7,3,10,0,7,5,3,0,7,12,10,5,3,7,2];
  const base=melody[musicStep%melody.length],root=73.42; // D2 bass
  const semitone=n=>root*Math.pow(2,n/12);
  musicNote(semitone(base+24),0.16,0.022,'square');
  if(musicStep%2===0)musicNote(semitone(base+12),0.21,0.032,'triangle');
  if(musicStep%4===0)musicNote(semitone(-12),0.30,0.055,'sawtooth');
  if(musicStep%8===7)musicNote(110,0.10,0.018,'square');
  musicStep++;
}
function startMusic(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  audioCtx.resume();
  if(!musicMaster){musicMaster=audioCtx.createGain();musicMaster.gain.value=0.58;musicMaster.connect(audioCtx.destination)}
  musicStep=0;
  // Immediate confirmation blip, then the repeating eerie chiptune.
  musicNote(220,0.09,0.07,'square');musicNote(164.81,0.14,0.05,'triangle',0.07);
  if(musicTimer)clearInterval(musicTimer);playMusicStep();musicTimer=setInterval(playMusicStep,220);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}if(audioCtx&&musicMaster){musicMaster.gain.cancelScheduledValues(audioCtx.currentTime);musicMaster.gain.setTargetAtTime(0.0001,audioCtx.currentTime,0.06)}}
document.getElementById('sound').addEventListener('click',()=>{
  soundOn=!soundOn;document.getElementById('sound').textContent='♪ SOUND: '+(soundOn?'ON':'OFF');
  if(soundOn){try{startMusic()}catch(e){soundOn=false;document.getElementById('sound').textContent='♪ SOUND: OFF'}}else stopMusic();
});

const stage=document.getElementById('stage');
function canvasX(e){const r=c.getBoundingClientRect();return (e.clientX-r.left)/r.width*360}
c.addEventListener('pointerdown',e=>{e.preventDefault();if(!run||dead){startGame()}pointer=canvasX(e);try{c.setPointerCapture(e.pointerId)}catch(_){}});
c.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||e.buttons)pointer=canvasX(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>c.addEventListener(ev,()=>pointer=null));
function bind(id,val){const b=document.getElementById(id);const down=e=>{e.preventDefault();keys=val;if(!run||dead)startGame()};const up=e=>{if(e)e.preventDefault();if(keys===val)keys=0};b.style.touchAction='none';b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);b.addEventListener('click',e=>{e.preventDefault();if(!run||dead)startGame();keys=val;setTimeout(()=>{if(keys===val)keys=0},140)});}
bind('left',-1);bind('right',1);window.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){keys=-1;e.preventDefault()}if(['ArrowRight','d','D'].includes(e.key)){keys=1;e.preventDefault()}if(e.key===' '){e.preventDefault();if(!run||dead)startGame();else{paused=!paused;document.getElementById('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';last=performance.now()}}if(e.key==='Escape'&&run){paused=!paused;document.getElementById('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';last=performance.now()}});window.addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key)&&keys===-1)keys=0;if(['ArrowRight','d','D'].includes(e.key)&&keys===1)keys=0});draw();
})();
